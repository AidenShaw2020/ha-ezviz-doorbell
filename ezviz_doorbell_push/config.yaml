name: EZVIZ Doorbell Push
version: "0.1.1"
slug: ezviz_doorbell_push
description: Real-time EZVIZ doorbell and motion events via MQTT discovery
url: https://github.com/AidenShaw2020/ha-ezviz-doorbell
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
services:
  - mqtt:need
options:
  ezviz_username: ""
  ezviz_password: ""
  ezviz_region: apiieu.ezvizlife.com
  serials: []
  verification_codes: []
  log_level: info
schema:
  ezviz_username: str
  ezviz_password: password
  ezviz_region: str
  serials:
    - str
  verification_codes:
    - serial: str
      code: password
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
