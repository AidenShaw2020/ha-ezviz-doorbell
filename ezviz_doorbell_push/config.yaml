name: EZVIZ Doorbell Push
version: "0.2.0"
slug: ezviz_doorbell_push
description: Real-time EZVIZ doorbell and motion events, device controls and live view via MQTT discovery
url: https://github.com/AidenShaw2020/ha-ezviz-doorbell
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
services:
  - mqtt:need
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Live view - snapshots, MJPEG and MPEG-TS for cameras without RTSP
options:
  ezviz_username: ""
  ezviz_password: ""
  ezviz_region: apiieu.ezvizlife.com
  serials: []
  verification_codes: []
  poll_interval: 5
  status_interval: 60
  live_stream: true
  snapshot_interval: 3
  ring_codes: []
  motion_codes: []
  log_level: info
schema:
  ezviz_username: str
  ezviz_password: password
  ezviz_region: str
  serials:
    - str
  verification_codes:
    - serial: str
      code: password
  poll_interval: int(0,3600)
  status_interval: int(0,86400)
  live_stream: bool
  live_stream_token: str?
  live_stream_url_base: str?
  snapshot_interval: int(1,60)
  ring_codes:
    - int
  motion_codes:
    - int
  log_level: list(debug|info|warning|error)
  mfa_code: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
